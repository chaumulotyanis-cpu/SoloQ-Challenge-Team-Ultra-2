name: Mise à jour des stats & déploiement

on:
  push:
    branches: [main]
  schedule:
    - cron: '*/30 * * * *'   # toutes les 30 minutes (GitHub peut avoir du retard)
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: maj-site
  cancel-in-progress: false

jobs:
  maj:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    env:
      RIOT_API_KEY: ${{ secrets.RIOT_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Récupérer les stats Riot
        if: env.RIOT_API_KEY != ''
        run: node scripts/update.mjs

      - name: Sauvegarder les nouvelles données
        if: env.RIOT_API_KEY != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- data/cache.json; then
            echo "Aucune nouvelle partie."
          else
            git add data/cache.json site/data/stats.json
            git commit -m "Mise à jour des stats"
            git pull --rebase && git push
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploiement
        uses: actions/deploy-pages@v4
